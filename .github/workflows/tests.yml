name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install torch==2.14.0 --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt pytest
      - run: pytest -q
